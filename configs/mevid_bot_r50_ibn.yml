_BASE_: "Base-bagtricks.yml"

# Bag of Tricks (BoT) R50-IBN, fine-tuned from fast-reid's MSMT17 checkpoint:
# https://github.com/JDAI-CV/fast-reid/releases/download/v0.1.1/msmt_bot_R50-ibn.pth
# Architecture mirrors fast-reid's configs/Base-bagtricks.yml so the weights load cleanly.

DATASETS:
  NAMES: ("MEVID_Mini",)
  TESTS: ("MEVID_Mini",)

MODEL:
  META_ARCHITECTURE: "Baseline"
  WEIGHTS: "/kaggle/working/msmt_bot_R50-ibn.pth"
  # Freeze the backbone for the first FREEZE_ITERS while the new classifier warms up
  FREEZE_LAYERS: ["backbone"]

  BACKBONE:
    NAME: "build_resnet_backbone"
    NORM: "BN"
    DEPTH: "50x"
    LAST_STRIDE: 1
    FEAT_DIM: 2048
    WITH_IBN: True
    WITH_NL: False
    # Whole model is initialised from MODEL.WEIGHTS, so skip the ImageNet download
    PRETRAIN: False

  HEADS:
    NAME: "EmbeddingHead"
    NORM: "BN"
    WITH_BNNECK: True
    POOL_LAYER: "GlobalAvgPool"
    NECK_FEAT: "before"
    CLS_LAYER: "Linear"
    EMBEDDING_DIM: 0

  LOSSES:
    NAME: ("CrossEntropyLoss", "TripletLoss")
    CE:
      EPSILON: 0.1
      SCALE: 1.0
    TRI:
      MARGIN: 0.3
      HARD_MINING: True
      NORM_FEAT: False
      SCALE: 1.0

SOLVER:
  OPT: "Adam"
  BASE_LR: 0.0001
  IMS_PER_BATCH: 32
  MAX_EPOCH: 60
  SCHED: "MultiStepLR"
  STEPS: [25, 45]
  GAMMA: 0.1
  WARMUP_FACTOR: 0.1
  WARMUP_ITERS: 500
  FREEZE_ITERS: 200
  CHECKPOINT_PERIOD: 5
  AMP:
    ENABLED: False

TEST:
  EVAL_PERIOD: 5

OUTPUT_DIR: "/kaggle/working/result/bot_train"
